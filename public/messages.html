<!DOCTYPE html>
<html>

<head>

<title>Contact Messages</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<div class="logo">Sharmila</div>

<ul>
<li><a href="index.html">Home</a></li>
</ul>

</nav>


<section class="section">

<h2>Contact Messages</h2>

<table id="messageTable">

<tr>
<th>Name</th>
<th>Email</th>
<th>Message</th>
</tr>

</table>

</section>


<script>

fetch("/contact")
.then(res=>res.json())
.then(data=>{

const table=document.getElementById("messageTable");

data.forEach(msg=>{

const row=table.insertRow();

row.innerHTML=`
<td>${msg.name}</td>
<td>${msg.email}</td>
<td>${msg.message}</td>
`;

});

});

</script>

</body>

</html>
